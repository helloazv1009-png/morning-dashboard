<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF7F0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="우리 집 살림">
<meta name="format-detection" content="telephone=no">
<title>우리 집 살림</title>
<style>
:root{
  --bg:#FBF7F0; --cream2:#F4EDE1; --card:#FFFFFF;
  --sage:#6E9075; --sage-dark:#4F7359; --sage-soft:#EDF3EC;
  --coral:#D4715C; --line:#EDE5D8;
  --ink:#3B3A33; --muted:#8C8A7E; --faint:#B5AF9F;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","Segoe UI",sans-serif;
  font-size:16px;line-height:1.42;min-height:100dvh;
  padding-bottom:calc(26px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
input{font:inherit;font-size:16px;color:var(--ink)}

/* ---------- top ---------- */
.topbar{
  position:sticky;top:0;z-index:20;
  background:rgba(251,247,240,.96);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-bottom:1px solid rgba(237,229,216,.85);
  padding:calc(10px + env(safe-area-inset-top)) 16px 8px;
}
.head{display:flex;align-items:center;justify-content:space-between;gap:8px;max-width:520px;margin:0 auto}
.brand{display:flex;align-items:center;gap:7px;font-size:17px;font-weight:800;letter-spacing:-.3px}
.brand .logo{font-size:20px;line-height:1}
.today{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
.tabs{display:flex;gap:3px;background:#F1EADD;border-radius:13px;padding:3px;max-width:520px;margin:9px auto 0}
.tab{flex:1;height:37px;border-radius:10px;text-align:center;font-size:14.5px;font-weight:700;color:var(--muted);transition:background .15s,color .15s}
.tab.on{background:#fff;color:var(--sage-dark);box-shadow:0 1px 3px rgba(90,75,50,.10)}

/* ---------- layout ---------- */
main{max-width:520px;margin:0 auto;padding:12px 14px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin:0 0 12px;box-shadow:0 1px 2px rgba(90,75,50,.035)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 0 6px}
.card-title{font-size:15.5px;font-weight:800;letter-spacing:-.3px}
.card-sub{font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}
.head-right{display:flex;align-items:center;gap:7px;flex:none}
.cnt{font-size:12.5px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.hint{font-size:12.5px;color:var(--muted);background:#FBF7EF;border-radius:10px;padding:8px 11px;margin:2px 0 8px;line-height:1.5}
.empty{font-size:12.5px;color:var(--faint);padding:4px 0 8px}
.foot{font-size:11.5px;color:var(--faint);text-align:center;padding:9px 0 2px;line-height:1.55}
.add-btn{
  width:32px;height:32px;border-radius:10px;background:var(--cream2);
  color:var(--sage-dark);font-size:19px;font-weight:600;
  display:inline-flex;align-items:center;justify-content:center;line-height:1;
}
.add-btn:active{background:#EAE1D1}

/* ---------- week ---------- */
.day{padding:8px 4px;border-top:1px solid var(--line)}
.day.first{border-top:0}
.day.today{background:var(--sage-soft);border-radius:12px;border-top-color:transparent;margin:2px -4px;padding:8px 10px}
.day.today + .day{border-top-color:transparent}
.day-head{display:flex;align-items:center;gap:8px;min-height:32px}
.dow{
  width:26px;height:26px;border-radius:50%;flex:none;
  background:var(--cream2);color:#6B6455;font-size:12.5px;font-weight:800;
  display:inline-flex;align-items:center;justify-content:center;
}
.day.today .dow{background:var(--sage);color:#fff}
.dnum{font-size:13px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.day.today .dnum{color:#5C7A63}
.badge{font-size:10.5px;font-weight:800;color:var(--sage-dark);background:#fff;border-radius:6px;padding:2px 6px}
.spacer{flex:1}

/* ---------- items ---------- */
.items{list-style:none;margin:0;padding:0}
.item{display:flex;align-items:center;gap:9px;min-height:42px}
.check{
  width:25px;height:25px;flex:none;border:1.6px solid #D8D0C1;border-radius:50%;
  display:flex;align-items:center;justify-content:center;color:#fff;
  font-size:13px;font-weight:800;line-height:1;position:relative;
}
.check::after{content:"";position:absolute;inset:-7px;border-radius:50%}
.item.done .check{background:var(--sage);border-color:var(--sage)}
.txt{
  flex:1;min-width:0;font-size:15.5px;padding:10px 0;line-height:1.35;
  overflow-wrap:anywhere;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;
}
.item.done .txt{color:#A8A396;text-decoration:line-through;text-decoration-thickness:1px}
.del{width:30px;height:34px;flex:none;border-radius:8px;color:#CFC8B8;font-size:13px;display:flex;align-items:center;justify-content:center}
.del:active{background:#F7F1E7;color:var(--coral)}
.item.editing{gap:6px}
.edit-input,.add-input{
  flex:1;min-width:0;background:#F8F3E9;border:1px solid #EDE4D4;border-radius:11px;
  padding:9px 12px;font-size:16px;
}
.edit-input:focus,.add-input:focus{outline:none;border-color:var(--sage);background:#fff}
.addrow{display:flex;gap:6px;align-items:center;padding:6px 0 2px}
.mini{font-size:13px;font-weight:700;color:var(--muted);padding:9px 6px;border-radius:8px;flex:none}
.mini.ok{color:var(--sage-dark)}
.mini:active{background:var(--cream2)}

/* ---------- month ---------- */
.cal{padding:10px 8px 8px}
.cal-head{display:flex;align-items:center;justify-content:space-between;padding:0 2px 6px}
.cal-title{font-size:15.5px;font-weight:800;letter-spacing:-.3px}
.nav{width:36px;height:36px;border-radius:10px;color:var(--muted);font-size:21px;display:flex;align-items:center;justify-content:center;line-height:1}
.nav:active{background:var(--cream2)}
.cal-dows{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11.5px;color:var(--muted);font-weight:700;padding:0 0 3px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cell{
  height:46px;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:13.5px;font-weight:600;color:#4A4638;
}
.cell .n{line-height:1;font-variant-numeric:tabular-nums}
.cell.today{box-shadow:inset 0 0 0 1.5px var(--sage);color:var(--sage-dark);font-weight:800}
.cell.sel{background:var(--sage);color:#fff;box-shadow:none;font-weight:800}
.dots{display:flex;gap:2px;height:5px;align-items:center}
.dots i{width:4px;height:4px;border-radius:50%;background:var(--sage);display:block}
.cell.sel .dots i{background:#fff}
.blank{display:block}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));
  transform:translate(-50%,8px);z-index:60;
  display:flex;align-items:center;gap:12px;
  background:rgba(56,52,42,.95);color:#fff;font-size:13.5px;font-weight:700;
  padding:11px 15px;border-radius:14px;max-width:calc(100vw - 32px);
  box-shadow:0 6px 20px rgba(40,35,25,.22);
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;
}
.toast.show{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
.toast .undo{color:#B7D8BE;font-size:13.5px;font-weight:800;flex:none;padding:2px 2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="topbar">
  <div class="head">
    <div class="brand"><span class="logo" aria-hidden="true">🏡</span><span>우리 집 살림</span></div>
    <div class="today" id="todayLine"></div>
  </div>
  <div class="tabs" role="tablist" aria-label="보기 전환">
    <button class="tab on" role="tab" data-act="tab" data-tab="week" aria-selected="true">주간</button>
    <button class="tab" role="tab" data-act="tab" data-tab="month" aria-selected="false">월간</button>
  </div>
</div>

<main>
  <section id="view-week" aria-label="주간 할 일"></section>
  <section id="view-month" aria-label="월간 할 일" hidden></section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite">
  <span id="toastText">삭제했어요</span>
  <button class="undo" id="toastUndo" data-act="undo" hidden>되돌리기</button>
</div>

<script>
(function(){
'use strict';

/* =========================================================
   우리 집 살림 · 주간 / 월간 (HOME_DASH_V2)
   빈 상태에서 시작 · 내용은 직접 추가
   ========================================================= */
var KEY='HOME_DASH_V2', VER=2, MAXLEN=80;
var DAYS=['월','화','수','목','금','토','일'];
var DOW_FULL=['일요일','월요일','화요일','수요일','목요일','금요일','토요일'];

var state=null, lastDel=null, toastTimer=null, longPressAt=0;

/* ---------- helpers ---------- */
function $(s,r){ return (r||document).querySelector(s); }
function $$(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }
function pad2(n){ return (n<10?'0':'')+n; }
function ymd(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function parseYmd(s){ var a=String(s).split('-'); return new Date(+a[0], +a[1]-1, +a[2]); }
function dowIdx(d){ return (d.getDay()+6)%7; }
function mondayOf(d){
  var t=new Date((d||new Date()).getFullYear(),(d||new Date()).getMonth(),(d||new Date()).getDate());
  t.setDate(t.getDate()-dowIdx(t));
  return ymd(t);
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function haptic(){ try{ if(navigator.vibrate) navigator.vibrate(6); }catch(e){} }
function todayText(){
  var d=new Date();
  return (d.getMonth()+1)+'월 '+d.getDate()+'일 '+DOW_FULL[d.getDay()];
}

/* ---------- state ---------- */
function blank(){
  var week={};
  DAYS.forEach(function(k){ week[k]=[]; });
  return {
    v:VER, tab:'week', weekStart:mondayOf(),
    week:week, days:{}, months:{},
    ui:{monthOffset:0, sel:ymd(new Date()), adding:null, editing:null}
  };
}
function cleanList(arr){
  if(!Array.isArray(arr)) return [];
  var out=[];
  arr.forEach(function(x){
    if(!x || typeof x.text!=='string') return;
    var t=x.text.trim();
    if(!t) return;
    out.push({ id:(typeof x.id==='string'&&x.id)?x.id:uid(), text:t.slice(0,MAXLEN), done:!!x.done });
  });
  return out;
}
function normalize(raw){
  var d=blank();
  if(!raw || typeof raw!=='object' || raw.v!==VER) return d;
  if(typeof raw.tab==='string' && (raw.tab==='week'||raw.tab==='month')) d.tab=raw.tab;
  if(typeof raw.weekStart==='string') d.weekStart=raw.weekStart;
  if(raw.week && typeof raw.week==='object'){
    DAYS.forEach(function(k){ d.week[k]=cleanList(raw.week[k]); });
  }
  if(raw.days && typeof raw.days==='object'){
    Object.keys(raw.days).forEach(function(k){
      if(/^\d{4}-\d{2}-\d{2}$/.test(k)) d.days[k]=cleanList(raw.days[k]);
    });
  }
  if(raw.months && typeof raw.months==='object'){
    Object.keys(raw.months).forEach(function(k){
      if(/^\d{4}-\d{2}$/.test(k)) d.months[k]=cleanList(raw.months[k]);
    });
  }
  return d;
}
function save(){
  try{
    localStorage.setItem(KEY, JSON.stringify({
      v:VER, tab:state.tab, weekStart:state.weekStart,
      week:state.week, days:state.days, months:state.months
    }));
    return true;
  }catch(e){
    toast('저장하지 못했어요 (저장 공간 부족)', false);
    return false;
  }
}
function load(){
  var raw=null;
  try{ raw=JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){ raw=null; }
  state=normalize(raw);
  var mk=mondayOf();
  if(state.weekStart!==mk){
    DAYS.forEach(function(k){ state.week[k].forEach(function(t){ t.done=false; }); });
    state.weekStart=mk;
    save();
  }
  state.ui={ monthOffset:0, sel:ymd(new Date()), adding:null, editing:null };
}

/* ---------- list access ---------- */
function keyParts(key){
  var i=key.indexOf(':');
  return { kind:key.slice(0,i), k:key.slice(i+1) };
}
function peek(key){
  var p=keyParts(key);
  if(p.kind==='week') return state.week[p.k]||[];
  if(p.kind==='day') return state.days[p.k]||[];
  if(p.kind==='month') return state.months[p.k]||[];
  return [];
}
function listOf(key){
  var p=keyParts(key);
  if(p.kind==='week'){ if(!state.week[p.k]) state.week[p.k]=[]; return state.week[p.k]; }
  if(p.kind==='day'){ if(!state.days[p.k]) state.days[p.k]=[]; return state.days[p.k]; }
  if(p.kind==='month'){ if(!state.months[p.k]) state.months[p.k]=[]; return state.months[p.k]; }
  return [];
}
function cleanup(key){
  var p=keyParts(key);
  if(p.kind==='day' && state.days[p.k] && !state.days[p.k].length) delete state.days[p.k];
  if(p.kind==='month' && state.months[p.k] && !state.months[p.k].length) delete state.months[p.k];
}
function findItem(key,id){
  var list=peek(key), out=null;
  list.forEach(function(x){ if(x.id===id) out=x; });
  return out;
}

/* ---------- toast ---------- */
function toast(msg, showUndo){
  var t=$('#toast'), b=$('#toastUndo');
  if(!t) return;
  $('#toastText').textContent=msg;
  b.hidden=!showUndo;
  t.hidden=false;
  void t.offsetWidth;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ hideToast(); }, showUndo?4500:2600);
}
function hideToast(){
  var t=$('#toast');
  if(!t) return;
  t.classList.remove('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ t.hidden=true; },220);
}

/* ---------- render ---------- */
function render(){
  $('#todayLine').textContent=todayText();
  $$('.tab').forEach(function(b){
    var on=b.dataset.tab===state.tab;
    b.classList.toggle('on',on);
    b.setAttribute('aria-selected', on?'true':'false');
  });
  var w=$('#view-week'), m=$('#view-month');
  if(state.tab==='month'){
    w.hidden=true; w.innerHTML='';
    m.hidden=false; m.innerHTML=monthHTML();
  }else{
    m.hidden=true; m.innerHTML='';
    w.hidden=false; w.innerHTML=weekHTML();
  }
  restoreFocus();
}
function restoreFocus(){
  var t=$('.add-input')||$('.edit-input');
  if(!t) return;
  try{
    t.focus();
    var n=t.value.length;
    t.setSelectionRange(n,n);
  }catch(e){}
}

function addRowHTML(key){
  return '<div class="addrow">'
    + '<input class="add-input" type="text" data-add="'+key+'" maxlength="'+MAXLEN+'" '
    + 'placeholder="할 일 입력" enterkeyhint="done" autocomplete="off" aria-label="할 일 입력">'
    + '<button class="mini ok" data-act="add-save" data-list="'+key+'">추가</button>'
    + '<button class="mini" data-act="add-cancel">취소</button>'
    + '</div>';
}
function itemHTML(t,key){
  if(state.ui.editing===t.id){
    return '<li class="item editing">'
      + '<input class="edit-input" type="text" value="'+esc(t.text)+'" data-edit="'+t.id+'" data-list="'+key+'" '
      + 'maxlength="'+MAXLEN+'" enterkeyhint="done" aria-label="할 일 수정">'
      + '<button class="mini ok" data-act="edit-save" data-list="'+key+'" data-id="'+t.id+'">저장</button>'
      + '<button class="mini" data-act="edit-cancel">취소</button>'
      + '</li>';
  }
  return '<li class="item'+(t.done?' done':'')+'">'
    + '<button class="check" data-act="toggle" data-list="'+key+'" data-id="'+t.id+'" '
    + 'role="checkbox" aria-checked="'+(t.done?'true':'false')+'" aria-label="'+esc(t.text)+' 완료">'
    + '<span aria-hidden="true">'+(t.done?'✓':'')+'</span></button>'
    + '<button class="txt" data-act="toggle" data-list="'+key+'" data-id="'+t.id+'">'+esc(t.text)+'</button>'
    + '<button class="del" data-act="del" data-list="'+key+'" data-id="'+t.id+'" aria-label="삭제">✕</button>'
    + '</li>';
}

function dayBlock(dow,date,key,first){
  var items=peek(key);
  var isToday=ymd(date)===ymd(new Date());
  var done=0;
  items.forEach(function(t){ if(t.done) done++; });
  var h='<div class="day'+(isToday?' today':'')+(first?' first':'')+'">';
  h+='<div class="day-head">'
    + '<span class="dow">'+dow+'</span>'
    + '<span class="dnum">'+date.getDate()+'</span>'
    + (isToday?'<span class="badge">오늘</span>':'')
    + '<span class="spacer"></span>'
    + (items.length?'<span class="cnt">'+done+'/'+items.length+'</span>':'')
    + '<button class="add-btn" data-act="add-open" data-list="'+key+'" aria-label="'+dow+'요일 할 일 추가">＋</button>'
    + '</div>';
  if(items.length) h+='<ul class="items">'+items.map(function(t){ return itemHTML(t,key); }).join('')+'</ul>';
  if(state.ui.adding===key) h+=addRowHTML(key);
  h+='</div>';
  return h;
}

function weekHTML(){
  var mon=parseYmd(state.weekStart);
  var end=new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+6);
  var total=0, done=0;
  DAYS.forEach(function(k){
    state.week[k].forEach(function(t){ total++; if(t.done) done++; });
  });
  var h='<div class="card">';
  h+='<div class="card-head"><div>'
    + '<div class="card-title">이번 주</div>'
    + '<div class="card-sub">'+(mon.getMonth()+1)+'월 '+mon.getDate()+'일 – '+(end.getMonth()+1)+'월 '+end.getDate()+'일</div>'
    + '</div><div class="head-right">'+(total?'<span class="cnt">'+done+'/'+total+'</span>':'')+'</div></div>';
  if(total===0) h+='<div class="hint">아직 비어 있어요. 날짜 옆 <b>＋</b> 를 눌러 할 일을 추가해 보세요.</div>';
  DAYS.forEach(function(k,i){
    var d=new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+i);
    h+=dayBlock(k,d,'week:'+k,i===0);
  });
  h+='<div class="foot">매주 반복 · 체크는 월요일에 새로 시작<br>글자를 길게 누르면 수정</div>';
  h+='</div>';
  return h;
}

function monthInfo(){
  var now=new Date();
  var off=state.ui.monthOffset||0;
  var first=new Date(now.getFullYear(),now.getMonth()+off,1);
  return {
    y:first.getFullYear(), m:first.getMonth(),
    days:new Date(first.getFullYear(),first.getMonth()+1,0).getDate(),
    lead:(first.getDay()+6)%7,
    key:first.getFullYear()+'-'+pad2(first.getMonth()+1)
  };
}
function monthHTML(){
  var mi=monthInfo(), now=new Date(), todayStr=ymd(now);
  if(String(state.ui.sel).slice(0,7)!==mi.key){
    state.ui.sel=(mi.y===now.getFullYear()&&mi.m===now.getMonth())?todayStr:(mi.key+'-01');
  }
  var sel=state.ui.sel;

  var h='<div class="card cal">';
  h+='<div class="cal-head">'
    + '<button class="nav" data-act="prev-month" aria-label="이전 달">‹</button>'
    + '<div class="cal-title">'+mi.y+'년 '+(mi.m+1)+'월</div>'
    + '<button class="nav" data-act="next-month" aria-label="다음 달">›</button>'
    + '</div>';
  h+='<div class="cal-dows">'+DAYS.map(function(d){ return '<span>'+d+'</span>'; }).join('')+'</div>';
  h+='<div class="cal-grid">';
  for(var i=0;i<mi.lead;i++) h+='<span class="blank"></span>';
  for(var d=1; d<=mi.days; d++){
    var ds=mi.key+'-'+pad2(d);
    var n=peek('day:'+ds).length;
    var cls='cell'+(ds===todayStr?' today':'')+(ds===sel?' sel':'');
    h+='<button class="'+cls+'" data-act="pick-date" data-date="'+ds+'" '
      + 'aria-label="'+(mi.m+1)+'월 '+d+'일'+(n?' 할 일 '+n+'개':'')+'"'
      + (ds===sel?' aria-current="date"':'')+'>'
      + '<span class="n">'+d+'</span>'
      + '<span class="dots">'+(n?new Array(Math.min(n,3)+1).join('<i></i>'):'')+'</span>'
      + '</button>';
  }
  var tail=(7-((mi.lead+mi.days)%7))%7;
  for(var j=0;j<tail;j++) h+='<span class="blank"></span>';
  h+='</div></div>';

  var sd=parseYmd(sel), dkey='day:'+sel;
  var items=peek(dkey), done=0;
  items.forEach(function(t){ if(t.done) done++; });
  h+='<div class="card">';
  h+='<div class="card-head"><div>'
    + '<div class="card-title">'+(sd.getMonth()+1)+'월 '+sd.getDate()+'일 '+DOW_FULL[sd.getDay()]+'</div>'
    + (sel===todayStr?'<div class="card-sub">오늘</div>':'')
    + '</div><div class="head-right">'
    + (items.length?'<span class="cnt">'+done+'/'+items.length+'</span>':'')
    + '<button class="add-btn" data-act="add-open" data-list="'+dkey+'" aria-label="이 날 할 일 추가">＋</button>'
    + '</div></div>';
  if(items.length) h+='<ul class="items">'+items.map(function(t){ return itemHTML(t,dkey); }).join('')+'</ul>';
  else h+='<div class="empty">이 날은 아직 할 일이 없어요</div>';
  if(state.ui.adding===dkey) h+=addRowHTML(dkey);
  h+='</div>';

  var mkey='month:'+mi.key;
  var mitems=peek(mkey), mdone=0;
  mitems.forEach(function(t){ if(t.done) mdone++; });
  h+='<div class="card">';
  h+='<div class="card-head"><div>'
    + '<div class="card-title">이 달 할 일</div>'
    + '<div class="card-sub">날짜와 상관없이 챙길 일</div>'
    + '</div><div class="head-right">'
    + (mitems.length?'<span class="cnt">'+mdone+'/'+mitems.length+'</span>':'')
    + '<button class="add-btn" data-act="add-open" data-list="'+mkey+'" aria-label="이 달 할 일 추가">＋</button>'
    + '</div></div>';
  if(mitems.length) h+='<ul class="items">'+mitems.map(function(t){ return itemHTML(t,mkey); }).join('')+'</ul>';
  else h+='<div class="empty">이번 달에 따로 챙길 일이 있으면 적어 두세요</div>';
  if(state.ui.adding===mkey) h+=addRowHTML(mkey);
  h+='</div>';

  h+='<div class="foot">날짜를 누르면 그날 할 일을 적을 수 있어요</div>';
  return h;
}

/* ---------- actions ---------- */
function flush(){
  var changed=false;
  var add=$('.add-input');
  if(add){
    var v=add.value.trim();
    if(v){ listOf(add.dataset.add).push({ id:uid(), text:v.slice(0,MAXLEN), done:false }); changed=true; }
    state.ui.adding=null;
  }
  var ed=$('.edit-input');
  if(ed){
    var it=findItem(ed.dataset.list, ed.dataset.edit);
    var ev=ed.value.trim();
    if(it && ev && it.text!==ev){ it.text=ev.slice(0,MAXLEN); changed=true; }
    state.ui.editing=null;
  }
  if(changed) save();
}
function addSave(key){
  var inp=$('.add-input[data-add="'+key+'"]');
  var v=inp?inp.value.trim():'';
  if(v){
    listOf(key).push({ id:uid(), text:v.slice(0,MAXLEN), done:false });
    haptic(); save();
  }
  state.ui.adding=key;
  render();
}
function saveEdit(key,id,val){
  var it=findItem(key,id);
  var v=String(val||'').trim();
  if(it && v && it.text!==v){ it.text=v.slice(0,MAXLEN); save(); }
  state.ui.editing=null;
  render();
}
function startEdit(key,id){
  state.ui.editing=id;
  state.ui.adding=null;
  render();
}
function toggleItem(key,id){
  var it=findItem(key,id);
  if(!it) return;
  it.done=!it.done;
  haptic(); save(); render();
}
function delItem(key,id){
  var list=peek(key), idx=-1;
  for(var i=0;i<list.length;i++){ if(list[i].id===id){ idx=i; break; } }
  if(idx<0) return;
  lastDel={ key:key, index:idx, item:list[idx] };
  list.splice(idx,1);
  cleanup(key);
  haptic(); save(); render();
  toast('삭제했어요', true);
}
function undoDelete(){
  if(!lastDel) return;
  var list=listOf(lastDel.key);
  var i=Math.min(lastDel.index, list.length);
  list.splice(i,0,lastDel.item);
  lastDel=null;
  save(); render(); hideToast();
}
function shiftMonth(delta){
  state.ui.monthOffset=(state.ui.monthOffset||0)+delta;
  var mi=monthInfo(), now=new Date();
  state.ui.sel=(mi.y===now.getFullYear()&&mi.m===now.getMonth())?ymd(now):(mi.key+'-01');
  state.ui.adding=null; state.ui.editing=null;
  render();
}

/* ---------- events ---------- */
document.addEventListener('click', function(e){
  if(Date.now()-longPressAt<700 && e.target.closest && e.target.closest('.txt')){
    e.preventDefault(); return;
  }
  var el=e.target.closest?e.target.closest('[data-act]'):null;
  if(!el) return;
  var act=el.dataset.act;

  if(act==='add-save'){ e.preventDefault(); addSave(el.dataset.list); return; }
  if(act==='add-cancel'){ e.preventDefault(); state.ui.adding=null; render(); return; }
  if(act==='edit-save'){ e.preventDefault(); var inp=$('.edit-input'); saveEdit(el.dataset.list, el.dataset.id, inp?inp.value:''); return; }
  if(act==='edit-cancel'){ e.preventDefault(); state.ui.editing=null; render(); return; }
  if(act==='undo'){ e.preventDefault(); undoDelete(); return; }

  flush();

  if(act==='tab'){
    state.tab=el.dataset.tab;
    state.ui.adding=null; state.ui.editing=null;
    save(); render();
  }else if(act==='toggle'){
    toggleItem(el.dataset.list, el.dataset.id);
  }else if(act==='del'){
    delItem(el.dataset.list, el.dataset.id);
  }else if(act==='add-open'){
    state.ui.adding=el.dataset.list;
    state.ui.editing=null;
    render();
  }else if(act==='edit-open'){
    startEdit(el.dataset.list, el.dataset.id);
  }else if(act==='pick-date'){
    state.ui.sel=el.dataset.date;
    state.ui.adding=null; state.ui.editing=null;
    render();
  }else if(act==='prev-month'){ shiftMonth(-1); }
  else if(act==='next-month'){ shiftMonth(1); }
}, true);

document.addEventListener('keydown', function(e){
  var t=e.target;
  if(!t || !t.classList) return;
  if(t.classList.contains('add-input')){
    if(e.key==='Enter'){ e.preventDefault(); addSave(t.dataset.add); }
    else if(e.key==='Escape'){ e.preventDefault(); state.ui.adding=null; render(); }
  }else if(t.classList.contains('edit-input')){
    if(e.key==='Enter'){ e.preventDefault(); saveEdit(t.dataset.list, t.dataset.edit, t.value); }
    else if(e.key==='Escape'){ e.preventDefault(); state.ui.editing=null; render(); }
  }
});

/* long press (480ms) on an item text → edit */
var pressTimer=null, pressStart=null;
document.addEventListener('pointerdown', function(e){
  var t=e.target.closest?e.target.closest('.txt'):null;
  if(!t) return;
  pressStart={ x:e.clientX, y:e.clientY, el:t };
  clearTimeout(pressTimer);
  pressTimer=setTimeout(function(){
    pressTimer=null;
    if(pressStart && pressStart.el===t){
      longPressAt=Date.now();
      haptic();
      startEdit(t.dataset.list, t.dataset.id);
    }
  }, 480);
}, true);
document.addEventListener('pointermove', function(e){
  if(!pressStart) return;
  if(Math.abs(e.clientX-pressStart.x)>10 || Math.abs(e.clientY-pressStart.y)>10){
    clearTimeout(pressTimer); pressTimer=null; pressStart=null;
  }
}, true);
document.addEventListener('pointerup', function(){
  clearTimeout(pressTimer); pressTimer=null; pressStart=null;
}, true);
document.addEventListener('pointercancel', function(){
  clearTimeout(pressTimer); pressTimer=null; pressStart=null;
}, true);
document.addEventListener('contextmenu', function(e){
  if(e.target.closest && e.target.closest('.txt')) e.preventDefault();
});

/* week rollover while the page stays open */
function checkWeek(){
  if(!state) return;
  var mk=mondayOf();
  if(state.weekStart!==mk){
    DAYS.forEach(function(k){ state.week[k].forEach(function(t){ t.done=false; }); });
    state.weekStart=mk;
    save(); render();
  }
}
document.addEventListener('visibilitychange', function(){
  if(!document.hidden){ checkWeek(); $('#todayLine').textContent=todayText(); }
});
window.addEventListener('focus', function(){ checkWeek(); });

/* ---------- boot ---------- */
load();
render();

window.__homeDash={
  get state(){ return state; },
  render:render,
  save:save,
  version:VER
};
})();
</script>
